<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Partner view — demo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A59F7;text-decoration:none}a:hover{color:#0846C4}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; background: #F1F3F5; font-family: 'Noto Sans', system-ui, sans-serif; color: #1A1C1E; overflow: hidden">
<div style="background: #23303F; color: #FFFFFF; padding: 16px 16px 18px; display: flex; align-items: center; gap: 4px">
<a href="Share.dc.html" aria-label="Back to Share" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Partner view</span><span style="font-size: 12px; color: #C9D3DE; letter-spacing: 0.4px">PARTNER · DEMO</span></div>
</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
<button type="button" style="min-height: 52px; border: 0; border-radius: 26px; background: #23303F; color: #FFFFFF; font: 600 15px 'Noto Sans', sans-serif">Use the code from this phone</button>
<section style="background: #FFFFFF; border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<span style="width: 72px; height: 72px; border-radius: 36px; background: #E2F3EC; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0C7553" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-size: 22px; font-weight: 700">Signature valid</span>
<span style="font-size: 14px; color: #2C3036">Tier B · Eligible: yes · 4 Sep – 3 Oct</span>
<span style="font-size: 12px; color: #4A5058">Key: HUKS key (from the partner's key registry)</span>
</section>
<section style="background: #FFFFFF; border-radius: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5D636B; letter-spacing: 0.2px">CHECKS, IN ORDER</h2>
<sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0C7553" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{c.t}}</div>
</sc-for>
</section>
<section style="background: #FFFFFF; border-radius: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5D636B; letter-spacing: 0.2px">TRY TO CHEAT</h2>
<button type="button" style="min-height: 48px; border: 1px solid #D5D9DE; border-radius: 24px; background: #FFFFFF; font: 600 14px 'Noto Sans', sans-serif; color: #1A1C1E">Verify the same code again</button>
<div style="font-size: 13px; color: #9A3A22; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A3A22" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"></path></svg>Already used — stopped at: not used before</div>
<button type="button" style="min-height: 48px; border: 1px solid #D5D9DE; border-radius: 24px; background: #FFFFFF; font: 600 14px 'Noto Sans', sans-serif; color: #1A1C1E">Change tier to A and verify</button>
<div style="font-size: 13px; color: #9A3A22; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A3A22" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"></path></svg>Invalid signature — stopped at: signature</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { checks: [ { t: 'Format' }, { t: 'Known key' }, { t: 'Signature over the exact claim' }, { t: 'Nonce issued by this partner' }, { t: 'Not used before' } ] };
  }
}
</script>
</body>
</html>
