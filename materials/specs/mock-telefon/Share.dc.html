<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var N = 25, cells = [], seed = 7;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    function finder(r, c) {
      var fs = [[0, 0], [0, 18], [18, 0]];
      for (var k = 0; k < fs.length; k++) {
        var rr = r - fs[k][0], cc = c - fs[k][1];
        if (rr >= 0 && rr < 7 && cc >= 0 && cc < 7) {
          var ring = rr === 0 || rr === 6 || cc === 0 || cc === 6;
          var core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
          return (ring || core) ? 1 : 0;
        }
        if (rr >= -1 && rr <= 7 && cc >= -1 && cc <= 7) return 0;
      }
      return -1;
    }
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var f = finder(r, c);
        var on = f === -1 ? (rnd() > 0.52) : f === 1;
        cells.push({ f: on ? '#1A1C1E' : 'transparent' });
      }
    }
    return { cells: cells };
  }
}
</script>
